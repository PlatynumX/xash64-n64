name: Build xash64-n64 r16 engine bring-up

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      XASH_SHA: ecda80fb9a29d45099a624344456eb3c7d01473d
      HLSDK_SHA: 8c5b2846c2448e2b063f358f041d565dc0f076b1
      LIBDRAGON_SHA: 35f85a0797324a5ed0c723203e33ab3c1da94fdd
    steps:
      - name: Checkout port package
        uses: actions/checkout@v6

      - name: Host preflight
        run: ./tests/host-check.sh

      - name: Clone exact upstreams
        run: |
          set -euo pipefail
          mkdir -p upstream out
          git clone --filter=blob:none --no-checkout https://github.com/FWGS/xash3d-fwgs.git upstream/xash3d-fwgs
          git -C upstream/xash3d-fwgs fetch --depth 1 origin "$XASH_SHA"
          git -C upstream/xash3d-fwgs checkout --detach "$XASH_SHA"
          git -C upstream/xash3d-fwgs submodule update --init --recursive --depth 1

          git clone --filter=blob:none --no-checkout https://github.com/FWGS/hlsdk-portable.git upstream/hlsdk-portable
          git -C upstream/hlsdk-portable fetch --depth 1 origin "$HLSDK_SHA"
          git -C upstream/hlsdk-portable checkout --detach "$HLSDK_SHA"
          git -C upstream/hlsdk-portable submodule update --init --recursive --depth 1

          git clone --filter=blob:none --no-checkout https://github.com/DragonMinded/libdragon.git upstream/libdragon
          git -C upstream/libdragon fetch --depth 1 origin "$LIBDRAGON_SHA"
          git -C upstream/libdragon checkout --detach "$LIBDRAGON_SHA"
          {
            echo "xash3d-fwgs $(git -C upstream/xash3d-fwgs rev-parse HEAD)"
            echo "hlsdk-portable $(git -C upstream/hlsdk-portable rev-parse HEAD)"
            echo "libdragon $(git -C upstream/libdragon rev-parse HEAD)"
            echo
            echo "Xash submodules:"
            git -C upstream/xash3d-fwgs submodule status --recursive
          } | tee out/upstream-revisions.txt
          python3 scripts/audit-xash-upstream.py upstream/xash3d-fwgs | tee out/upstream-audit.txt
          # Keep the exact pristine headers that drive library_suffix platform
          # detection. If source integration stops again, the artifact itself
          # contains the source we matched rather than forcing screenshot archaeology.
          cp upstream/xash3d-fwgs/3rdparty/library_suffix/include/build.h out/library-suffix-build.pristine.h
          cp upstream/xash3d-fwgs/3rdparty/library_suffix/include/buildenums.h out/library-suffix-buildenums.pristine.h
          git -C upstream/xash3d-fwgs/3rdparty/library_suffix rev-parse HEAD > out/library-suffix-revision.txt

      - name: Build pinned libdragon and cross-compile real Xash core
        id: xashbuild
        shell: bash
        run: |
          set -o pipefail
          docker pull ghcr.io/dragonminded/libdragon:latest
          docker run --rm \
            --mount type=bind,source="${GITHUB_WORKSPACE}",target=/work \
            --workdir=/work \
            ghcr.io/dragonminded/libdragon:latest \
            bash -lc '
              set -euo pipefail
              export N64_INST=/n64_toolchain
              make -C upstream/libdragon -j2 install-mk
              make -C upstream/libdragon -j2 clobber
              make -C upstream/libdragon -j2 libdragon tools
              make -C upstream/libdragon -j2 install tools-install
              "$PWD/scripts/build-xash-r16.sh" "$PWD/upstream/xash3d-fwgs" "$PWD/out"
            '

      - name: Capture source diff and toolchain provenance
        if: always()
        run: |
          set +e
          mkdir -p out
          git -C upstream/xash3d-fwgs diff -- . ':(exclude)3rdparty/library_suffix' > out/xash-r16-source.diff
          git -C upstream/xash3d-fwgs/3rdparty/library_suffix diff > out/library-suffix-r16-source.diff
          # Defensive host-side copies: even if the container exits before the
          # build driver can preserve Waf diagnostics, the bind-mounted checkout
          # still contains them.
          if test -f upstream/xash3d-fwgs/build/config.log; then
            cp upstream/xash3d-fwgs/build/config.log out/xash-r16-waf-config.log
          fi
          if test -f upstream/xash3d-fwgs/wscript; then cp upstream/xash3d-fwgs/wscript out/xash-r16-patched-wscript.txt; fi
          if test -f upstream/xash3d-fwgs/engine/wscript; then cp upstream/xash3d-fwgs/engine/wscript out/xash-r16-patched-engine-wscript.txt; fi
          docker run --rm ghcr.io/dragonminded/libdragon:latest bash -lc '/n64_toolchain/bin/mips64-elf-gcc --version | head -n 1' > out/toolchain-version.txt 2>&1
          if test -f out/xash64-n64-r16.z64; then sha256sum out/xash64-n64-r16.z64 | tee out/rom-sha256.txt; fi

      - name: Upload r16 ROM or first-frontier diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xash64-n64-r16
          path: out/
          if-no-files-found: error
